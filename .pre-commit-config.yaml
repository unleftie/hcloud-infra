repos:
  - repo: local
    hooks:
      - id: terraform-docs
        name: Generate Terraform documentation
        description: "Generates Terraform documentation and formats it with Prettier"
        entry: bash -c "terraform-docs . && prettier --write README.md"
        files: \.(tf|tofu|terraform\.lock\.hcl)$
        exclude: \.terraform/.*$
        language: system
        require_serial: true
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
        args:
          - --args=--disable-rule=terraform_required_version
          - --args=--disable-rule=terraform_required_providers
          - --args=--disable-rule=terraform_module_pinned_source
      # - id: terraform_checkov
      #   args:
      #     - --args=--quiet
      #     - --args=--skip-path ".terraform"
      - id: terraform_trivy
        args:
          # UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          - --args=--severity HIGH,CRITICAL
          - --args=--skip-dirs="**/.terraform"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-executables-have-shebangs
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      - id: betterleaks
    # based on https://github.com/antonbabenko/pre-commit-terraform/blob/master/.pre-commit-hooks.yaml#L21
    # https://pre-commit.com/#creating-new-hooks
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
  - repo: local
    hooks:
      - id: terraform_test
        name: Run Terraform mock tests
        description: "Runs Terraform tests with mock providers"
        entry: bash -c "terraform test"
        files: \.(tf|tofu|terraform\.lock\.hcl)$
        exclude: \.terraform/.*$
        language: system
        require_serial: true
